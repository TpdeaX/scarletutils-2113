name: Build ScarletUtils 2.113 DLL

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Win32 DLL
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Win32 x86)
        run: cmake -B build -A Win32

      - name: Build Release DLL
        run: cmake --build build --config Release

      - name: Upload compiled DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: scarletutils_2113.dll
          path: build/Release/scarletutils_2113.dll
